project:
  name: air_quality_forecasting
  target: aqi
  primary_model: mamba

run:
  name: null
  models:
    - mamba
    - lstm
    - transformer
    - classical
  output_root: runs

data:
  source: gold_minio
  data_path: null
  freq: h
  time_col: time
  location_col: location_key
  target_col: aqi
  metric_cols:
    - pm25
    - pm10
    - no2
    - o3
    - so2
    - co
    - aod
    - dust
    - uv_index
    - co2
    - aqi

features:
  time_features:
    - hour_sin
    - hour_cos
    - month_sin
    - month_cos
    - day_of_week
    - is_weekend

dataset:
  prefix_template: training_dataset/run_id={run_id}
  seq_len: 144
  pred_len: 12
  sample_stride: 1
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2

scaling:
  method: standard
  fit_on: train
  target_mode: absolute

quality:
  hard_fail_cols:
    - _invalid_segment
    - _flag_duplicate
    - _flag_physical_bound
    - _flag_aqi_range
  imputed_col: _imputed
  max_imputed_ratio: 0.3
  low_coverage_col: _flag_low_coverage
  max_low_coverage_ratio: 0.5

training:
  min_train_samples: 256
  lr_t_max: null
  min_lr: 0.00001
  mlflow_enabled: true
  mlflow_experiment: AQI Forecasting
  mlflow_tracking_uri: http://localhost:5000

mamba:
  enabled: true
  epochs: 150
  batch_size: 32
  window_size: 144
  horizon: 12
  lr: 0.0002
  loss: huber
  seed: 42
  num_workers: 0
  d_model: 128
  n_layers: 3
  d_ff: 192
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  device: cuda
  amp: true
  sample_stride: 1
  weight_decay: 0.0003
  grad_accum_steps: 1
  max_grad_norm: 0
  patience: 20
  min_delta: 0.000001
  min_lr: 0.00001
  forecast_24h: false
  forecast_base: null
  forecast_out: null
  auto_cpu_for_slow_mamba: false

lstm:
  enabled: true
  epochs: 150
  batch_size: 32
  window_size: 144
  horizon: 12
  lr: 0.00015
  weight_decay: 0.00008
  max_grad_norm: 0.5
  loss: huber
  seed: 42
  num_workers: 0
  hidden_size: 128
  d_model: 128
  n_layers: 2
  dropout: 0.1
  device: cuda
  amp: true
  sample_stride: 1
  grad_accum_steps: 1
  early_stop_patience: 20
  patience: 20
  min_delta: 0.000001
  min_lr: 0.00001
  overfit_threshold: 0.05
  predict: false
  output_csv: null

transformer:
  enabled: true
  epochs: 150
  batch_size: 32
  window_size: 144
  horizon: 12
  lr: 0.00015
  weight_decay: 0.001
  max_grad_norm: 0.7
  loss: huber
  seed: 42
  num_workers: 0
  d_model: 96
  n_layers: 2
  device: cuda
  gpu: 0
  model_id: air_quality_AQI
  model: Transformer
  features: MS
  freq: h
  label_len: 48
  d_layers: 1
  enc_in: 17
  dec_in: 1
  c_out: 1
  d_ff: 192
  dim_feedforward: 192
  n_heads: 4
  factor: 1
  dropout: 0.2
  embed: timeF
  activation: gelu
  patience: 20
  min_delta: 0.000001
  min_lr: 0.00001
  lradj: none
  des: Exp
  inverse: true
  amp: false
  use_amp: false
  sample_stride: 1
  grad_accum_steps: 1

classical:
  enabled: true
  models:
    - naive
    - moving_average
    - arima
    - sarima
  horizon: 12
  window_size: 144
  moving_average_window: 24
  arima_order:
    - 2
    - 1
    - 2
  sarima_order:
    - 1
    - 1
    - 1
  sarima_seasonal_order:
    - 1
    - 0
    - 1
    - 24

inference:
  horizon_hours: 12
  use_latest_hours: 144

minio:
  bronze_bucket: air-quality
  silver_bucket: air-quality-silver
  gold_bucket: air-quality-gold
  artifacts_bucket: air-quality-artifacts
